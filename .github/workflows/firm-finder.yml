name: CA land-firm finder

# Run it from GitHub: Actions tab -> "CA land-firm finder" -> "Run workflow".
# Results download from the finished run's page under "Artifacts".
on:
  workflow_dispatch:
    inputs:
      counties:
        description: 'Counties, comma-separated (e.g. "Placer, El Dorado"). Type "all" for all 58.'
        required: true
        default: "Placer, El Dorado"
      check_websites:
        description: "Check each firm's website for land wording and staff emails"
        type: boolean
        default: true
      dre:
        description: "Also download the CA DRE list of every licensed firm"
        type: boolean
        default: false
      crm:
        description: "Supabase CRM: none, dry-run (count only), or push (add new contacts)"
        type: choice
        options: [none, dry-run, push]
        default: none
  # To run automatically, uncomment this (example: Mondays 6am Eastern = 10:00 UTC).
  # A scheduled run uses all 58 counties and the defaults below.
  # schedule:
  #   - cron: "0 10 * * 1"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub's limit is 6 hours; all 58 counties with website checks can take several
    defaults:
      run:
        working-directory: firm_finder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: firm_finder/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Offline tests
        run: python test_firm_finder.py

      - name: Run firm finder
        env:
          COUNTIES: ${{ github.event.inputs.counties || 'all' }}
          CHECK_WEBSITES: ${{ github.event.inputs.check_websites || 'true' }}
          DRE: ${{ github.event.inputs.dre || 'false' }}
          CRM: ${{ github.event.inputs.crm || 'none' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          args=()
          if [ "$(echo "$COUNTIES" | tr '[:upper:]' '[:lower:]' | xargs)" != "all" ]; then
            IFS=',' read -ra list <<< "$COUNTIES"
            args+=(--counties)
            for c in "${list[@]}"; do
              c="$(echo "$c" | xargs)"   # trim spaces
              [ -n "$c" ] && args+=("$c")
            done
          fi
          [ "$CHECK_WEBSITES" != "true" ] && args+=(--skip-websites)
          [ "$DRE" = "true" ] && args+=(--dre)
          if [ "$CRM" != "none" ]; then
            if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
              echo "::error::CRM option needs repo secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY"
              exit 1
            fi
            [ "$CRM" = "push" ] && args+=(--push) || args+=(--crm-dry-run)
          fi
          echo "Running: python run.py ${args[*]}"
          python run.py "${args[@]}" | tee run_summary.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### Firm finder results"
            echo '```'
            cat run_summary.txt 2>/dev/null || echo "No summary (run failed early, see logs artifact)."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firm-finder-${{ github.run_number }}
          path: |
            firm_finder/output/
            firm_finder/logs/
            firm_finder/run_summary.txt
          if-no-files-found: warn
          retention-days: 30
